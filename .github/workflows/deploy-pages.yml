name: Deploy GDS Playground to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --omit=optional
      - name: Install Linux native build bindings
        run: npm install --no-save @rollup/rollup-linux-x64-gnu @rolldown/binding-linux-x64-gnu
      - name: Build GDS Theme
        run: npm run build --workspace=@sovereignsquad/gds-theme
      - name: Build GDS Core
        run: npm run build --workspace=@sovereignsquad/gds-core
      - name: Build GDS Admin
        run: npm run build --workspace=@sovereignsquad/gds-admin
      - name: Build Playground
        run: npm run build --workspace=playground
      - name: Verify Pages content gate
        # Fast, Pages-specific sanity gate before deploying to production.
        # Deliberately NOT the full `verify:release` — the sibling `GDS
        # Quality` workflow already runs that on every push to `main` (in
        # parallel, not as a dependency of this workflow), so duplicating it
        # here would double CI cost for no new signal. This subset instead
        # targets what's specific to the live site: it builds/lints/tests,
        # confirms the component catalog is still complete, and checks for
        # known legacy-link regressions and required trust-page content.
        run: |
          npm run lint --workspace=playground
          npx vitest run apps/playground
          node scripts/verify-component-catalog-parity.mjs
          node scripts/verify-playground-internal-links.mjs
          node scripts/verify-playground-route-links.mjs
          node scripts/verify-website-trust.mjs
      - name: Setup SPA Routing Fallback
        run: cp ./apps/playground/dist/index.html ./apps/playground/dist/404.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './apps/playground/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Checkout
        # Needed for scripts/verify-pages-deploy-smoke.mjs and its
        # scripts/lib/browser-runtime.mjs helper below — this job has no
        # repo checkout by default.
        uses: actions/checkout@v5
      - name: Post-deploy smoke check
        # apps/playground is a pure client-side-rendered SPA (see
        # scripts/generate-playground-static-routes.mjs) — the raw served
        # HTML is always just an empty <div id="root"> shell, so a plain
        # curl+grep can never see rendered content (this replaced an earlier
        # version of this step that tried exactly that and failed in
        # production for precisely this reason). This launches headless
        # Chrome — already preinstalled on GitHub's ubuntu-latest runners —
        # to actually navigate to the deployed URL and wait for the SPA to
        # hydrate and render real content, the same technique this repo's
        # local verify-*-runtime.mjs scripts already use.
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          for attempt in 1 2 3; do
            if node scripts/verify-pages-deploy-smoke.mjs "$url"; then
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 15s (Pages propagation can lag briefly)..."
            sleep 15
          done
          exit 1
