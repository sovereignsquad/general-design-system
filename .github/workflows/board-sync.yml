name: GDS Issue Board

# Keeps the label-based issue board consistent (see PROJECT_BOARD.md). The
# "board" is GitHub Issues grouped by their `status:` label — there is no
# external Projects v2 board.
#
# This job:
#   1. provisions the canonical board labels (`npm run board:labels`) so their
#      colors/descriptions match scripts/board-labels.config.mjs, and
#   2. audits the board (`npm run audit:board:strict`) so every open issue sits
#      in exactly one status column.
#
# AUTH: both steps use the ambient GITHUB_TOKEN with `issues: write`. No secret
# PAT is required — this is the whole point of moving off Projects v2, whose
# org-level writes the default token could not perform (it needed a
# `GDS_PROJECT_TOKEN` PAT that had to be provisioned separately and warned-and-
# skipped when absent).
#
# TRIGGER: `workflow_run` after "GDS Release Bundles" completes, plus manual
# dispatch and any push to main that changes the board tooling. `workflow_run`
# is used (not `push: tags`) because a tag pushed by the default GITHUB_TOKEN
# never fires other workflows' `push`/`tag` triggers (GitHub's anti-recursion
# rule); `workflow_run` is unaffected.

on:
  workflow_run:
    workflows: ["GDS Release Bundles"]
    types: [completed]
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/board-labels.config.mjs"
      - "scripts/ensure-board-labels.mjs"
      - "scripts/audit-issue-board.mjs"
      - ".github/workflows/board-sync.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: gds-issue-board
  cancel-in-progress: false

jobs:
  issue-board:
    # On workflow_run, only sync when the release bundle actually succeeded.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Provision board labels
        env:
          GH_TOKEN: ${{ github.token }}
          GDS_BOARD_LABELS_STRICT: "1"
        run: npm run board:labels

      - name: Audit issue board (every open issue in one status column)
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run audit:board:strict
