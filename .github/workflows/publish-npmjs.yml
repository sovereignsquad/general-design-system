name: GDS Publish (npmjs.com)

# Publishes all seven GDS packages to the public npmjs.com registry —
# npm's own registry supports fully anonymous `npm install`, unlike GitHub
# Packages, which requires an authenticated read:packages token for every
# install regardless of package visibility (a GitHub platform limitation,
# not a GDS choice). This is the only real path to a zero-token consumer
# install.
#
# Authenticates with npm trusted publishing (OIDC): no npm token is stored or
# read. Each of the seven @sovereignsquad packages needs a trusted publisher
# on npmjs.com (Organization or user `sovereignsquad`, Repository
# `general-design-system`, Workflow filename `publish-npmjs.yml`); until that
# is registered this workflow fails cleanly at the publish step with an auth
# error. npm CLI 11.5.1 or later and a GitHub-hosted runner are required.
# Policy and setup order: RELEASE_PUBLISH.md "Registry policy decision" (#938).
# Dispatch it manually on a release tag; it is not part of
# auto-tag-release.yml's automatic dispatch list.
#
# GitHub Packages (publish-github-packages.yml) remains the canonical,
# audit-friendly registry; this is a second, additive distribution channel,
# not a replacement.

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GDS_NPM_REGISTRY: https://registry.npmjs.org

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
          scope: "@sovereignsquad"

      - name: Require npm 11.5.1 or later (trusted publishing)
        run: |
          v=$(npm --version)
          [ "$(printf '%s\n' 11.5.1 "$v" | sort -V | head -n1)" = 11.5.1 ] || { echo "npm $v is older than 11.5.1, trusted publishing needs 11.5.1 or later"; exit 1; }

      - name: Install dependencies
        run: npm ci --omit=optional

      - name: Install Linux native build bindings
        run: npm install --no-save @rollup/rollup-linux-x64-gnu @rolldown/binding-linux-x64-gnu

      - name: Verify release quality gates
        run: npm run verify:release

      - name: Publish packages to npmjs.com
        run: npm run publish:npm

      - name: Verify registry publication
        run: npm run verify:published
        env:
          GDS_REGISTRY_RETRIES: 15
          GDS_REGISTRY_DELAY_MS: 10000
